<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La meva primera pàgina web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }
        main {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <header>
        <h1>Benvingut/da a la meva web!</h1>
    </header>

    <main>
        <h2>Sobre aquesta pàgina</h2>
        <p>Aquest és un exemple de codi HTML simple amb una mica d'estil CSS integrat.</p>
        
        <h3>Llista de coses per fer:</h3>
        <ul>
            <li>Aprendre HTML5</li>
            <li>Aprendre CSS</li>
            <li>Crear projectes genials</li>
        </ul>

        <button onclick="saludar()">Clica'm!</button>
    </main>

    <script>
        function saludar() {
            alert('Hola! Gràcies per visitar la pàgina.');
        }
    </script>

</body>
</html>
